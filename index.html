<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My IPTV Player</title>
    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            width: 100%;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <!-- শুধু একটি ভিডিও প্লেয়ার - কোন চ্যানেল লিস্ট নেই, কোন টেক্সট নেই -->
    <video id="player" controls>
        <source src="" type="application/x-mpegURL">
        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
    </video>

    <script>
        // প্লেয়ারে কিছু লোড করবে না - শুধু ফাঁকা থাকবে
        const video = document.getElementById('player');
        
        // কোন ভিডিও লোড করবে না
        video.addEventListener('loadstart', (e) => {
            e.preventDefault();
            return false;
        });
    </script>
</body>
</html>
